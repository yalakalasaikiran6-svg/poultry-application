<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Vijalakshmi Chicken Center - Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="with-logo">
      <img src="/images/logo.svg" alt="Vijalakshmi Chicken Center logo" class="logo">
      <div class="header-text">
        <h1>Vijalakshmi Chicken Center</h1>
        <div class="location">Location: Parvathipuram</div>
      </div>
    </header>
    <main>
      <section class="grid">
        <div class="card">
          <h2>Today's Summary</h2>
          <div id="summary">Loading...</div>
          <div class="price-box">
            <h3>Today's Price</h3>
            <div>Price per hen: <span id="priceHen">-</span></div>
            <div>Price per kg (broiler): <span id="priceKg">-</span></div>
            <form id="priceForm">
              <label>Price per hen <input type="number" step="0.01" name="price_per_hen"></label>
              <label>Price per kg <input type="number" step="0.01" name="price_per_kg"></label>
              <button type="submit">Set Today's Price</button>
            </form>
          </div>
        </div>

        <div class="card">
          <h2>Add Birds</h2>
          <form id="addBirdForm">
            <label>Type
              <select name="type">
                <option value="hen">Hen</option>
                <option value="broiler">Broiler</option>
              </select>
            </label>
            <label>Qty <input type="number" name="qty" value="1" min="1"></label>
            <label>Cost per hen <input type="number" name="cost_per_hen" step="0.01"></label>
            <label>Cost per kg <input type="number" name="cost_per_kg" step="0.01"></label>
            <label>Weight (kg) <input type="number" name="weight_kg" step="0.01"></label>
            <button type="submit">Add</button>
          </form>
        </div>

        <div class="card">
          <h2>Birds (select to sell or mark deceased)</h2>
          <div id="birdsList">Loading...</div>
          <div class="actions">
            <label>Total amount for selected sale <input id="saleAmount" type="number" step="0.01"></label>
            <button id="sellSelected">Sell Selected</button>
            <button id="deceasedSelected">Mark Deceased</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <small>Vijalakshmi Chicken Center — Parvathipuram</small>
    </footer>

    <script>
      async function loadSummary() {
        const res = await fetch('/api/summary/today');
        const data = await res.json();
        // show a nicer summary
        const lines = [];
        lines.push(`Hens sold today (qty): ${data.hens_sold_today_qty}`);
        lines.push(`Broilers sold today (kg): ${data.broilers_sold_kg_today}`);
        lines.push(`Chickens left (alive): ${data.chickens_left}`);
        lines.push(`Deceased hens cost today: ${data.deceased_hens_cost_today}`);
        lines.push(`Avg cost per hen: ${data.avg_cost_per_hen}`);
        lines.push(`Avg cost per kg (broiler): ${data.avg_cost_per_kg_broiler}`);
        lines.push(`Today's earnings (computed): ${data.todays_earnings}`);
        document.getElementById('summary').innerText = lines.join('\n');
        document.getElementById('priceHen').innerText = data.price_per_hen || 0;
        document.getElementById('priceKg').innerText = data.price_per_kg || 0;
      }

      async function fetchPrice() {
        const r = await fetch('/api/price');
        const p = await r.json();
        document.querySelector('#priceForm [name=price_per_hen]').value = p.price_per_hen || '';
        document.querySelector('#priceForm [name=price_per_kg]').value = p.price_per_kg || '';
        document.getElementById('priceHen').innerText = p.price_per_hen || 0;
        document.getElementById('priceKg').innerText = p.price_per_kg || 0;
      }

      async function loadBirds() {
        const res = await fetch('/api/birds');
        const birds = await res.json();
        const container = document.getElementById('birdsList');
        if (!birds.length) { container.innerHTML = '<p>No birds yet.</p>'; return; }
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        thead.innerHTML = '<tr><th></th><th>ID</th><th>Type</th><th>Status</th><th>Cost</th><th>Weight</th><th>Added</th></tr>';
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        birds.forEach(b => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><input type="checkbox" data-id="${b.id}"></td>
            <td>${b.id}</td>
            <td>${b.type}</td>
            <td>${b.status}</td>
            <td>${b.cost_per_hen || b.cost_per_kg || ''}</td>
            <td>${b.weight_kg || ''}</td>
            <td>${b.added_at}</td>
          `;
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        container.innerHTML = '';
        container.appendChild(table);
      }

      document.getElementById('addBirdForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const body = {
          type: form.type.value,
          qty: Number(form.qty.value) || 1,
          cost_per_hen: form.cost_per_hen.value ? Number(form.cost_per_hen.value) : null,
          cost_per_kg: form.cost_per_kg.value ? Number(form.cost_per_kg.value) : null,
          weight_kg: form.weight_kg.value ? Number(form.weight_kg.value) : null
        };
        await fetch('/api/birds', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        form.reset();
        form.qty.value = 1;
        await loadBirds();
        await loadSummary();
        await fetchPrice();
      });

      document.getElementById('sellSelected').addEventListener('click', async () => {
        const checked = Array.from(document.querySelectorAll('#birdsList input[type=checkbox]:checked'));
        if (!checked.length) return alert('Select birds to sell');
        const ids = checked.map(c => Number(c.dataset.id));
        const total = Number(document.getElementById('saleAmount').value);
        if (!total) return alert('Enter total sale amount');
        const body = { bird_type: 'hen', bird_ids: ids, total_amount: total, qty: ids.length };
        await fetch('/api/sales', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        await loadBirds();
        await loadSummary();
      });

      document.getElementById('deceasedSelected').addEventListener('click', async () => {
        const checked = Array.from(document.querySelectorAll('#birdsList input[type=checkbox]:checked'));
        if (!checked.length) return alert('Select birds to mark deceased');
        const ids = checked.map(c => Number(c.dataset.id));
        await fetch('/api/deceased', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ ids }) });
        await loadBirds();
        await loadSummary();
      });

      document.getElementById('priceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const body = {
          price_per_hen: form.price_per_hen.value ? Number(form.price_per_hen.value) : 0,
          price_per_kg: form.price_per_kg.value ? Number(form.price_per_kg.value) : 0
        };
        await fetch('/api/price', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        await fetchPrice();
        await loadSummary();
      });

      // initial load
      loadSummary();
      loadBirds();
      fetchPrice();
      // refresh periodically
      setInterval(() => { loadSummary(); loadBirds(); fetchPrice(); }, 15000);
    </script>
  </body>
</html>
